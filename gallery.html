<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحة شخصية - Bootstrap</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css"
      integrity="sha384-CfCrinSRH2IR6a4e6fy2q6ioOX7O6Mtm1L9vRvFZ1trBncWmMePhzvafv7oIcWiW"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg bg-body-tertiary bg-dark py-3 border-bottom border-info border-2"
      data-bs-theme="dark"
    >
      <div class="container">
        <a class="navbar-brand" href="index.html"
          ><i class="bi bi-person-circle fs-3"></i
          ><span class="fs-3 px-2">صفحة</span
          ><span class="fs-3 text-info">اسم الطالب</span></a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul
            class="navbar-nav me-auto mb-2 mb-lg-0 justify-content-lg-end flex-lg-row w-100"
          >
            <li class="nav-item">
              <a
                class="nav-link active text-info"
                aria-current="page"
                href="index.html"
                >الرئيسية</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="gallery.html">معرض الاعمال</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div id="carouselExampleCaptions" class="carousel slide py-5 my-5">
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="#carouselExampleCaptions"
          data-bs-slide-to="0"
          class="active bg-info"
          aria-current="true"
          aria-label="Slide 1"
        ></button>
        <button
          type="button"
          data-bs-target="#carouselExampleCaptions"
          data-bs-slide-to="1"
          aria-label="Slide 2"
          class="bg-info"
        ></button>
        <button
          type="button"
          data-bs-target="#carouselExampleCaptions"
          data-bs-slide-to="2"
          aria-label="Slide 3"
          class="bg-info"
        ></button>
      </div>
      <div class="carousel-inner mx-auto">
        <div class="carousel-item active text-center">
          <img
            src="img/pek1.png"
            class="d-block mx-auto img-fluid"
            alt="..."
            style="max-height: 50vh"
          />
          <div class="mt-3">
            <h5>لوحة تفاعلية</h5>
            <p class="mb-5">
              هذا النص هو مثال لنص يمكن أن يستبدل في نفس المساحة.
            </p>
          </div>
        </div>
        <div class="carousel-item text-center">
          <img
            src="img/pek2.png"
            class="d-block mx-auto img-fluid"
            alt="..."
            style="max-height: 50vh"
          />
          <div class="mt-3">
            <h5>معرض الصور التجربي</h5>
            <p class="mb-5">
              هذا النص هو مثال لنص يمكن أن يستبدل في نفس المساحة.
            </p>
          </div>
        </div>
        <div class="carousel-item text-center">
          <img
            src="img/pek3.png"
            class="d-block mx-auto img-fluid"
            alt="..."
            style="max-height: 50vh"
          />
          <div class="mt-3">
            <h5>مدونة شخصية</h5>
            <p class="mb-5">
              هذا النص هو مثال لنص يمكن أن يستبدل في نفس المساحة.
            </p>
          </div>
        </div>
      </div>
      <button
        class="carousel-control-prev d-none d-md-block"
        type="button"
        data-bs-target="#carouselExampleCaptions"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button
        class="carousel-control-next d-none d-md-block"
        type="button"
        data-bs-target="#carouselExampleCaptions"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
    <footer class="bg-info text-white text-center py-4">
      <p class="mb-0">صفحة شخصية. جميع الحقوق محفوظة. &copy; 2026</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
